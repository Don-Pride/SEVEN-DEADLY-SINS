<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}

.sz{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:104px;justify-content:flex-end}
